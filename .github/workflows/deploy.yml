# #app shell - builds the app and puts it on github pages every time we push to main
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # or run it by hand from the actions tab

# what github actions is allowed to do
permissions:
  contents: read
  pages: write
  id-token: write

# if we push twice fast, cancel the older one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci # install exact versions from package-lock
      - run: npm run build # makes dist/
        env:
          # repo variables, if they're set. not really needed anymore since the public key is in supabase.js.
          # #security - public values only, never the service role/secret key
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      # hand dist/ to github pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # second job: actually publish it
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # the live url
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
